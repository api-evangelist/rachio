openapi: 3.2.0
info:
  title: Property Service API
  version: 1.0.0
servers:
- url: https://cloud-rest.rach.io
security:
- bearerAuth: []
tags:
- name: PropertyService
paths:
  /property/findPropertyByEntity:
    get:
      tags:
      - PropertyService
      operationId: PropertyService_FindPropertyByEntity
      description: Resolve the property for a given entity ID. Provide only one entity ID.
      parameters:
      - name: resource_id.location_id
        in: query
        schema:
          type: string
      - name: resource_id.base_station_id
        in: query
        schema:
          type: string
      - name: resource_id.lighting_area_id
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindPropertyByEntityResponse'
      summary: Property service find property by entity
      x-summary-source: derived
  /property/getProperty/{id}:
    get:
      tags:
      - PropertyService
      operationId: PropertyService_GetProperty
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPropertyResponse'
      summary: Property service get property
      x-summary-source: derived
  /property/listProperties/{userId}:
    get:
      tags:
      - PropertyService
      operationId: PropertyService_ListProperties
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPropertiesResponse'
      summary: Property service list properties
      x-summary-source: derived
components:
  schemas:
    ListPropertiesResponse:
      type: object
      properties:
        property:
          type: array
          items:
            $ref: '#/components/schemas/Property'
    GetPropertyResponse:
      type: object
      properties:
        property:
          $ref: '#/components/schemas/Property'
    Property:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        address:
          $ref: '#/components/schemas/Address'
        entities:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        shared:
          type: boolean
        weatherStationId:
          type: string
        favorite:
          type: boolean
        ownerUserId:
          type: string
    Entity:
      type: object
      properties:
        id:
          type: string
        type:
          enum:
          - LOCATION
          - WEATHER_STATION
          - BASE_STATION
          - LIGHTING_AREA
          type: string
          format: enum
    GeoPoint:
      type: object
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
    Address:
      type: object
      properties:
        id:
          type: string
        lineOne:
          type: string
        lineTwo:
          type: string
        locality:
          type: string
        administrativeArea:
          type: string
        postalCode:
          type: string
        regionCode:
          type: string
          description: 'Country like US or CA. NOTE: This is the country _code_ and not the full string name'
        geoPoint:
          $ref: '#/components/schemas/GeoPoint'
        timezone:
          type: string
    FindPropertyByEntityResponse:
      type: object
      properties:
        property:
          $ref: '#/components/schemas/Property'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
