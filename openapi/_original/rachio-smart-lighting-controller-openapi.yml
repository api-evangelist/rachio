  /lighting/setLightingZoneDesiredDimmingSettings:
    put:
      tags:
      - LightingService
      operationId: LightingService_SetLightingZoneDesiredDimmingSettings
      description: Set a lighting zone's calibration settings. Controller firmware scales all dimming levels to within the min and max range.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetLightingZoneDesiredDimmingSettingsRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetLightingZoneDesiredDimmingSettingsResponse'
  /lighting/setLightingZoneDimmingLevels:
    put:
      tags:
      - LightingService
      operationId: LightingService_SetLightingZoneDimmingLevels
      description: Set zones to the specified dimming level. This will turn a zone on if it is currently off. Input dimming percentage is automatically scaled by the firmware to within the calibrated dimming range.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetLightingZoneDimmingLevelsRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetLightingZoneDimmingLevelsResponse'
  /lighting/setLightingZoneStates:
    put:
      tags:
      - LightingService
      operationId: LightingService_SetLightingZoneStates
      description: Turn zones on or off. Zones turn on to their default dimming percentage.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetLightingZoneStatesRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetLightingZoneStatesResponse'
