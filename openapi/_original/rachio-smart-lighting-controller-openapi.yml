            application/json:
              schema:
                $ref: '#/components/schemas/UpdateLightingZoneGroupResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    LightingArea:
      type: object
      description: A top level resource that contains all additional lighting resources.
      properties:
        id:
          type: string
        shared:
          type: boolean
          description: shared is true when the user does not actually own this area, but has been granted shared access to it
    ListLightingAreasResponse:
      type: object
      properties:
        lighting_areas:
          type: array
          items:
            $ref: '#/components/schemas/LightingArea'
    GetLightingAreaResponse:
      type: object
      properties:
        lighting_area:
          $ref: '#/components/schemas/LightingArea'
    LightingController:
      type: object
      description: A smart lighting controller
      properties:
        id:
          type: string
        lighting_area_id:
          type: string
        serial_number:
          type: string
        mac_address:
          type: string
        model:
          enum:
          - LIGHTING_CONTROLLER_200W_3ZONE_GEN1
          type: string
          format: enum
        name:
          type: string
        reported_state:
          $ref: '#/components/schemas/LightingControllerReportedState'
        max_total_wattage:
          type: integer
          format: int32
        program_configuration_hash:
          type: string
          description: An internal representation of the controller program data
    LightingControllerReportedMatterConfiguration:
      type: object
      description: Rachio matter fabric details
      properties:
        fabric_id:
          type: string
        node_id:
          type: string
    WattageMeasurement:
      type: object
      description: Wattage measurement with timestamp
      properties:
        wattage:
          type: integer
          format: int32
        timestamp:
          type: string
          format: date-time
    LightingControllerReportedState:
      type: object
      description: The last reported state of the controller
      properties:
        connected:
          type: boolean
        firmware_version:
          type: string
        state:
          enum:
          - ERROR
          - NORMAL
          - OTA_IN_PROGRESS
          type: string
          format: enum
        log_level:
          enum:
          - INFO
          - WARN
          - ERROR
          - DEBUG
          - TRACE
          type: string
          format: enum
        current_total_wattage:
          type: integer
          format: int32
        last_state_update:
          type: string
          format: date-time
        program_configuration_hash:
          type: string
        rssi:
          type: integer
          format: int32
        rssi_signal_strength:
          enum:
          - NONE
          - POOR
          - STRONG
          type: string
          format: enum
        matter_configuration:
          $ref: '#/components/schemas/LightingControllerReportedMatterConfiguration'
        max_wattage_reported:
          $ref: '#/components/schemas/WattageMeasurement'
    ListLightingControllersResponse:
      type: object
      properties:
        lighting_controllers:
          type: array
          items:
            $ref: '#/components/schemas/LightingController'
    GetLightingControllerResponse:
      type: object
      properties:
        lighting_controller:
          $ref: '#/components/schemas/LightingController'
    UpdateLightingControllerRequest:
      type: object
      description: All update properties aside from the id are optional
      properties:
        id:
          type: string
        name:
          type: string
    UpdateLightingControllerResponse:
      type: object
      properties:
        lighting_controller:
          $ref: '#/components/schemas/LightingController'
    LightingZone:
      type: object
      properties:
        id:
          type: string
        lighting_controller_id:
          type: string
        zone_number:
          type: integer
          format: uint32
        name:
          type: string
        reported_state:
          $ref: '#/components/schemas/LightingZoneReportedState'
        order:
          type: integer
          format: uint32
        enabled:
          type: boolean
        dimmable:
          type: boolean
        lighting_controller_serial_number:
          type: string
        lighting_controller_name:
          type: string
        max_output:
          enum:
          - TWELVE_VOLTS
          - FIFTEEN_VOLTS
          type: string
          format: enum
    LightingZoneReportedDimmingSettings:
      type: object
      description: Reported dimming configuration including calibration and current dim level. Percentage fields are integers [0,100]. Note that the firmware handles scaling based on min and max. The default and current dim levels are always [0,100]
      properties:
        min_dimming_percent:
          type: integer
          format: uint32
        max_dimming_percent:
          type: integer
          format: uint32
        default_dimming_percent:
          type: integer
          format: uint32
        current_dimming_percent:
          type: integer
          format: uint32
    LightingZoneReportedState:
      type: object
      description: The last reported state of the zone
      properties:
        state:
          enum:
          - ERROR
          - 'ON'
          - 'OFF'
          type: string
          format: enum
        dimming_settings:
          $ref: '#/components/schemas/LightingZoneReportedDimmingSettings'
        current_wattage:
          type: integer
          format: int32
        max_wattage_reported:
          $ref: '#/components/schemas/WattageMeasurement'
    ListLightingZonesResponse:
      type: object
      properties:
        lighting_zones:
          type: array
          items:
            $ref: '#/components/schemas/LightingZone'
    GetLightingZoneResponse:
      type: object
      properties:
        lighting_zone:
          $ref: '#/components/schemas/LightingZone'
    UpdateLightingZoneRequest:
      type: object
      description: All update properties aside from the id are optional. Adjusting dimmable and max_output will automatically adjust calibration.
      properties:
        id:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        dimmable:
          type: boolean
        max_output:
          enum:
          - TWELVE_VOLTS
          - FIFTEEN_VOLTS
          type: string
          format: enum
    UpdateLightingZoneResponse:
      type: object
      properties:
        lighting_zone:
          $ref: '#/components/schemas/LightingZone'
    SetLightingZoneStatesRequest:
      type: object
      properties:
        id:
          type: array
          items:
            type: string
        state:
          enum:
          - 'ON'
          - 'OFF'
          type: string
          format: enum
    SetLightingZoneStatesResponse:
      type: object
      properties: {}
    SetLightingZoneDimmingLevelsRequest:
      type: object
      properties:
        id:
          type: array
          items:
            type: string
        dimming_percent:
          type: integer
          format: uint32
    SetLightingZoneDimmingLevelsResponse:
      type: object
      properties: {}
    LightingZoneDesiredDimmingSettings:
      type: object
      description: Desired calibration settings for a zone. Percentage fields are integers [0,100]
      properties:
        min_dimming_percent:
          type: integer
          format: int32
        max_dimming_percent:
          type: integer
          format: int32
        default_dimming_percent:
          type: integer
          format: int32
    SetLightingZoneDesiredDimmingSettingsRequest:
      type: object
      properties:
        id:
          type: string
        desired_dimming_settings:
          $ref: '#/components/schemas/LightingZoneDesiredDimmingSettings'
    SetLightingZoneDesiredDimmingSettingsResponse:
      type: object
      properties: {}
    CreateLightingZoneGroupRequest:
      type: object
      properties:
        name:
          type: string
        lighting_area_id:
          type: string
        lighting_zone_ids:
          type: array
          items:
            type: string
    CreateLightingZoneGroupResponse:
      type: object
      properties:
        lighting_zone_group:
          $ref: '#/components/schemas/LightingZoneGroup'
    LightingZoneGroup:
      type: object
      description: A set of lighting zones.
      properties:
        id:
          type: string
        lighting_area_id:
          type: string
        name:
          type: string
        lighting_zone_ids:
          type: array
          items:
            type: string
        order:
          type: integer
          format: uint32
    ListLightingZoneGroupsResponse:
      type: object
      properties:
        lighting_zone_groups:
          type: array
          items:
            $ref: '#/components/schemas/LightingZoneGroup'
    GetLightingZoneGroupResponse:
      type: object
      properties:
        lighting_zone_group:
          $ref: '#/components/schemas/LightingZoneGroup'
    LightingZoneDimmingSetting:
      type: object
      properties:
        lighting_zone_id:
          type: string
        dimming_percent:
          type: integer
          format: int32
    LightingZoneIds:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
        dimming_settings:
          type: array
          description: Custom program dimming levels to use. Default settings are created when a zone dimming setting is not provided.
          items:
            $ref: '#/components/schemas/LightingZoneDimmingSetting'
    UpdateLightingZoneGroupRequest:
      type: object
      description: All update properties aside from the id are optional
      properties:
        id:
          type: string
        name:
          type: string
        lighting_zone_ids:
          $ref: '#/components/schemas/LightingZoneIds'
    UpdateLightingZoneGroupResponse:
      type: object
      properties:
        lighting_zone_group:
          $ref: '#/components/schemas/LightingZoneGroup'
    DeleteLightingZoneGroupResponse:
      type: object
      properties: {}
    CreateLightingSceneRequest:
      type: object
      properties:
        name:
          type: string
        lighting_area_id:
          type: string
        lighting_scene_settings:
          type: array
          items:
            $ref: '#/components/schemas/LightingSceneSetting'
    CreateLightingSceneResponse:
      type: object
      properties:
        lighting_scene:
          $ref: '#/components/schemas/LightingScene'
    LightingScene:
      type: object
      description: Preconfigured lighting settings for a group of zones
      properties:
        id:
          type: string
        lighting_area_id:
          type: string
        name:
          type: string
        lighting_scene_settings:
          type: array
          items:
            $ref: '#/components/schemas/LightingSceneSetting'
    LightingSceneSetting:
      type: object
      description: A setting for a single zone in a scene. The dimming percentage is optional.
      properties:
        lighting_zone_id:
          type: string
        lighting_zone_state:
          enum:
          - 'ON'
          - 'OFF'
          type: string
          format: enum
        dimming_percent:
          type: integer
          format: int32
    ListLightingScenesResponse:
      type: object
      properties:
        lighting_scenes:
          type: array
          items:
            $ref: '#/components/schemas/LightingScene'
    GetLightingSceneResponse:
      type: object
      properties:
        lighting_scene:
          $ref: '#/components/schemas/LightingScene'
    LightingSceneSettings:
      type: object
      properties:
        settings:
          type: array
          items:
            $ref: '#/components/schemas/LightingSceneSetting'
    UpdateLightingSceneRequest:
      type: object
      description: All update properties aside from the id are optional
      properties:
        id:
          type: string
        name:
          type: string
        lighting_scene_settings:
          $ref: '#/components/schemas/LightingSceneSettings'
    UpdateLightingSceneResponse:
      type: object
      properties:
        lighting_scene:
          $ref: '#/components/schemas/LightingScene'
    DeleteLightingSceneResponse:
      type: object
      properties: {}
    ActivateLightingSceneResponse:
      type: object
      properties: {}
    DeactivateLightingSceneResponse:
      type: object
      properties: {}
    CreateLightingProgramRequest:
      type: object
      description: Create a new program. A program can have one of both of on_at and off_at. Only one of zones, groups, or scenes can be provided.
      properties:
        lighting_area_id:
          type: string
        name:
          type: string
        on_at:
          $ref: '#/components/schemas/LightingTime'
        off_at:
          $ref: '#/components/schemas/LightingTime'
        days_of_week:
          type: array
