name: Rachio
description: >-
  Rachio makes smart, WiFi-connected irrigation controllers, Smart Hose Timers and
  lighting controllers for homes and landscapes. The Rachio Public API lets
  developers read a person's account, controllers (devices) and irrigation zones,
  start and stop watering, manage fixed and Flex (weather-adjusted) schedules, set
  rain delays, and subscribe to real-time webhook events for schedule and zone
  activity. Requests authenticate with an OAuth2 bearer token retrieved from the
  Rachio mobile app; the Controller and User API is served at https://api.rach.io/1
  and newer product surfaces at https://cloud-rest.rach.io, with a quota of 3,500
  requests per day per token.
